<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro Weight Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator">
    <div class="controls">
      <h1 id="title"></h1>
      <div class="weight">
        <label for="user-weight">Enter your weight</label>
        <input id="user-weight" type="text" placeholder="Weight (lbs)" />
      </div>
      <div class="planet">
        <label for="planets">Select a Planet</label>
        <select name="planets" id="planets"></select>
      </div>

      <button id="calculate-button">Calculate</button>
      <p id="output"></p>
    </div>

    <div class="image-container">
      <img id="planet-image" alt="Featured celestial body">
    </div>
  </div>
  <script src="main.js" charset="utf-8"></script>
</body>

</html>
